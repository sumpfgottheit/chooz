name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install build tools
        run: sudo apt-get install -y upx-ucl reprepro createrepo-c openssh-client rsync

      - name: Prepare GPG signing key
        run: |
          echo "${{ secrets.PACKAGES_GPG_KEY }}" > /tmp/gpg-signing.asc
          echo "${{ secrets.PACKAGES_GPG_KEY }}" | gpg --batch --import

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          GPG_KEY_FILE: /tmp/gpg-signing.asc

      - name: Checkout packages repo
        uses: actions/checkout@v4
        with:
          repository: sumpfgottheit/packages
          token: ${{ secrets.PACKAGES_DEPLOY_TOKEN }}
          path: packages-repo

      - name: Publish DEB packages
        run: |
          for deb in dist/*.deb; do
            reprepro -b packages-repo/apt includedeb stable "$deb"
          done

      - name: Push to packages repo
        working-directory: packages-repo
        run: |
          git config user.name "goreleaserbot"
          git config user.email "bot@goreleaser.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: release ${{ github.ref_name }}"
          git push

      - name: Configure RPM repo SSH deploy key
        env:
          PACAKGES_DEPLOY_SSH_KEY: ${{ secrets.PACAKGES_DEPLOY_SSH_KEY }}
          PACKAGES_DEPLOY_SSH_KEY: ${{ secrets.PACKAGES_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 0700 -d "$HOME/.ssh"
          deploy_key="${PACAKGES_DEPLOY_SSH_KEY:-${PACKAGES_DEPLOY_SSH_KEY:-}}"
          test -n "$deploy_key"
          printf '%s\n' "$deploy_key" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
          cat > "$HOME/.ssh/known_hosts" <<'EOF'
          cloud.sumpfgottheit.casa ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBGFKlCQmWOnGldSWv3tZiaO2mvo6lnnxnBIfzLHeHcb/JEhM4yzwuWjYknEqzTPuCBdimAdvM5fZ+OrjiW2NBrw=
          cloud.sumpfgottheit.casa ssh-rsa 
          cloud.sumpfgottheit.casa ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE3sHejViWGvp+Rdm6EGGTnCoWPDJUXMp5Otaw+z7pKV
          EOF
          sed -i 's/^          //' "$HOME/.ssh/known_hosts"
          chmod 0644 "$HOME/.ssh/known_hosts"

      - name: Prepare RPM repositories
        run: |
          set -euo pipefail
          shopt -s nullglob

          remote="repo-deploy@cloud.sumpfgottheit.casa"
          ssh_cmd="ssh -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes"

          stage_arch() {
            local arch="$1"
            local remote_path="/srv/rpms/rocky/9/$arch"
            local repo_dir="repo-rpm/$arch"
            shift

            mkdir -p "$repo_dir"
            $ssh_cmd "$remote" "mkdir -p '$remote_path'"
            rsync -az -e "$ssh_cmd" "$remote:$remote_path/" "$repo_dir/"

            if [ "$#" -eq 0 ]; then
              echo "no RPM artifact found for $arch" >&2
              exit 1
            fi

            cp "$@" "$repo_dir/"
            createrepo_c --update "$repo_dir/"
          }

          stage_arch x86_64 dist/*amd64*.rpm dist/*x86_64*.rpm
          stage_arch aarch64 dist/*arm64*.rpm dist/*aarch64*.rpm

      - name: Deploy RPM repositories
        run: |
          set -euo pipefail
          remote="repo-deploy@cloud.sumpfgottheit.casa"
          ssh_cmd="ssh -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes"

          for arch in x86_64 aarch64; do
            rsync -az --delete --delay-updates -e "$ssh_cmd" "repo-rpm/$arch/" "$remote:/srv/rpms/rocky/9/$arch/"
          done
